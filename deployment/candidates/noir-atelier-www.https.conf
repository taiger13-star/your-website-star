# Stage 2 only: install after the separate www certificate has actually been issued.
server {
    listen 80;
    listen [::]:80;
    server_name www.noir-atelier.ru;
    location / {
        return 301 https://noir-atelier.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.noir-atelier.ru;
    ssl_certificate /etc/letsencrypt/live/noir-atelier-www-seo-20261104/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noir-atelier-www-seo-20261104/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://noir-atelier.ru$request_uri;
}

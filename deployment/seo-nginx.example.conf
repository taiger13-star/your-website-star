# TEMPLATE ONLY. Not installed or applied. Merge with the existing nginx configuration.
# Replace every __PLACEHOLDER__ after inspecting the VPS; do not overwrite a working config.
# Certificate must cover BOTH noir-atelier.ru and www.noir-atelier.ru BEFORE enabling :443 www.

server {
    listen 80;
    server_name noir-atelier.ru www.noir-atelier.ru;
    # Preserve the existing ACME challenge location if certificate renewal uses webroot.
    location /.well-known/acme-challenge/ {
        root __EXISTING_ACME_WEBROOT__;
    }
    location / { return 301 https://noir-atelier.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.noir-atelier.ru;
    ssl_certificate __EXISTING_FULLCHAIN_COVERING_BOTH_HOSTS__;
    ssl_certificate_key __EXISTING_PRIVATE_KEY_PATH__;
    return 301 https://noir-atelier.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name noir-atelier.ru;
    ssl_certificate __EXISTING_FULLCHAIN_COVERING_BOTH_HOSTS__;
    ssl_certificate_key __EXISTING_PRIVATE_KEY_PATH__;

    # Remove any old exact /sitemap.xml location returning 404, and SPA index.html fallbacks.
    # Preserve existing upload-size/time limits and application-specific proxy settings.
    location / {
        proxy_pass http://127.0.0.1:__EXISTING_NODE_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # No proxy_intercept_errors / error_page 404 =200 /index.html.
        # Do not cache account, checkout, admin, authentication or server-function responses.
    }
}
